title = "agent-governance-kit gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "onepassword-service-account-token-extended"
description = "1Password Service Account Token (standard base64, base64url, or short payload)"
regex = '''ops_[A-Za-z0-9+/._-]{100,}={0,3}'''
keywords = ["ops_"]

  [[rules.allowlists]]
  description = "Anchored synthetic 1Password service account token placeholders"
  regexTarget = "match"
  regexes = [
    '''^ops_(?:eyJ)?(?:[Xx]{100,}|0{100,})={0,3}$''',
    '''^ops_(?:EXAMPLE|DUMMY|PLACEHOLDER|REDACTED)[A-Za-z0-9+/._-]*={0,3}$''',
    '''^ops_[A-Za-z0-9+/._-]*(?:EXAMPLE|DUMMY|PLACEHOLDER|REDACTED)={0,3}$''',
  ]

[[rules]]
id = "onepassword-secret-key"
description = "1Password Account Secret Key"
regex = '''\bA3-[A-Z0-9]{6}-(?:[A-Z0-9]{6}-[A-Z0-9]{5}|[A-Z0-9]{11})-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}\b'''
keywords = ["A3-"]

  [[rules.allowlists]]
  description = "Anchored synthetic 1Password secret key placeholders"
  regexTarget = "match"
  regexes = [
    '''^A3-(?:X{6}-(?:X{6}-X{5}|X{11})-X{5}-X{5}-X{5}|0{6}-(?:0{6}-0{5}|0{11})-0{5}-0{5}-0{5})$''',
    '''^A3-[A-Z0-9]{6}-(?:(?:X{6}|0{6}|DUMMY[A-Z0-9]|EXAMP[A-Z0-9]|REDAC[A-Z0-9]|PLACE[A-Z0-9]|TEST[A-Z0-9]{2})-(?:X{5}|0{5}|DUMMY|EXAMP|REDAC|PLACE|HOLDR|TEST[A-Z0-9])|(?:X{11}|0{11}|PLACEHOLDER|EXAMPLE[A-Z0-9]{4}|REDACTED[A-Z0-9]{3}|DUMMY[A-Z0-9]{6}))-(?:X{5}|0{5}|DUMMY|EXAMP|REDAC|PLACE|HOLDR|TEST[A-Z0-9])-(?:X{5}|0{5}|DUMMY|EXAMP|REDAC|PLACE|HOLDR|TEST[A-Z0-9])-(?:X{5}|0{5}|DUMMY|EXAMP|REDAC|PLACE|HOLDR|TEST[A-Z0-9])$''',
  ]
